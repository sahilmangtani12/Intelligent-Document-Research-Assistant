services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      # Lets the container reach Ollama running on your computer (LLM_PROVIDER=ollama).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  app-data:
