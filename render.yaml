# Render Blueprint: backend as a Docker web service with a persistent disk.
# Use LLM_PROVIDER=groq in the cloud (Ollama needs your own machine / a GPU server).
# The embedding model needs ~1-2 GB RAM, so pick an instance with at least 2 GB.
services:
  - type: web
    name: doc-research-api
    runtime: docker
    rootDir: backend
    plan: standard
    healthCheckPath: /api/health
    disk:
      name: app-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false          # set in the Render dashboard
      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app
      - key: DATA_DIR
        value: /app/data
